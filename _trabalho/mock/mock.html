<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=Jost:wght@500&display=block">
<style>html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#F3EADF}canvas{position:absolute;inset:0}
.t{position:absolute;left:56px;top:50%;transform:translateY(-50%);width:547px;font-family:'Bodoni Moda',serif;color:#2A0C1B}
.chip{display:inline-flex;gap:10px;padding:8px 14px;border-radius:10px;border:1px solid rgba(184,138,59,.45);background:rgba(250,246,239,.7);font:500 12px/1.3 Jost;letter-spacing:.24em;text-transform:uppercase;color:#7E5A1E}
h1{margin:22px 0 0;font-weight:500;font-size:66px;line-height:1.02;letter-spacing:-.015em}
em{font-style:italic;font-weight:400;color:#5A1E3A}
.nav{position:absolute;top:0;left:0;right:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;font:500 12.5px Jost;letter-spacing:.18em;text-transform:uppercase;color:#2A0C1B}
.cta{background:#5A1E3A;color:#F2E6CF;padding:14px 20px;border-radius:999px}
</style>
<canvas id="c" width="1440" height="900"></canvas>
<div class="nav"><span style="font-family:'Bodoni Moda';font-size:21px;letter-spacing:0;text-transform:none">Glória Festas</span><span>As festas · Como funciona · Fotos · Feedbacks · Dúvidas</span><span class="cta">Solicite um orçamento</span></div>
<div class="t"><span class="chip">✦ Buffet Glória Festas · desde 2010</span><h1 id="h">Debaixo desta tampa, <em>uma festa inteira.</em></h1></div>
<script>
const P = new URLSearchParams(location.search);
const img = new Image(); img.src = P.get('img');
if (P.get('titulo')) document.getElementById('h').innerHTML = P.get('titulo');
img.onload = () => {
  const c = document.getElementById('c'), x = c.getContext('2d'), W = 1440, H = 900;
  x.fillStyle = '#F3EADF'; x.fillRect(0, 0, W, H);
  // estrelas douradas (mesma receita do site), 40 quadros de movimento para formar os riscos
  const CORES = [[184,138,59],[214,181,108],[201,160,88],[90,30,58]], cx = W * .65, cy = H * .58, D = W, foco = H * .5;
  const est = []; for (let i = 0; i < 230; i++) est.push({ x: (Math.random() - .5) * W * 1.6, y: (Math.random() - .5) * H * 1.6, z: Math.random() * D, c: CORES[Math.random() < .16 ? 3 : (Math.random() * 3) | 0], s: Math.random() < .17 });
  for (const e of est) { const za = e.z + 10; const k = foco / e.z, ka = foco / za; const X = cx + e.x * k, Y = cy + e.y * k, Xa = cx + e.x * ka, Ya = cy + e.y * ka; const b = Math.min(1, Math.max(.05, 1 - e.z / D)); const a = Math.max(.14, Math.pow(b, .7) * .9); x.strokeStyle = `rgba(${e.c},${a})`; x.lineWidth = .6 + b * 2; x.beginPath(); x.moveTo(Xa, Ya); x.lineTo(X, Y); x.stroke(); }
  // tampa: fundo × (1 − alfa) + cor pré-multiplicada
  const s = Math.max(W / 1920, H / 1080), dw = 1920 * s, dh = 1080 * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
  const inv = document.createElement('canvas'); inv.width = 1920; inv.height = 1080; const ix = inv.getContext('2d');
  ix.drawImage(img, 0, 1080, 1920, 1080, 0, 0, 1920, 1080); ix.globalCompositeOperation = 'difference'; ix.fillStyle = '#fff'; ix.fillRect(0, 0, 1920, 1080);
  x.globalCompositeOperation = 'multiply'; x.drawImage(inv, ox, oy, dw, dh);
  x.globalCompositeOperation = 'lighter'; x.drawImage(img, 0, 0, 1920, 1080, ox, oy, dw, dh);
  window.pronto = true;
};
</script>
